name: P0 Validation Temp

on:
  push:
    branches:
      - p0-mainline-container-hardening
  pull_request:
    branches:
      - p0-mainline-container-hardening
  workflow_dispatch:

jobs:
  validate-p0:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Setup Melos
        run: |
          set -e
          dart pub global activate melos 7.8.1
          melos bootstrap

      - name: Flutter analyze
        working-directory: apps/weblibre
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Targeted repository tests
        working-directory: apps/weblibre
        run: flutter test test/features/geckoview/domain/repositories/tab_test.dart

      - name: Debug APK compile
        working-directory: apps/weblibre
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: weblibre-p0-debug-apk
          path: apps/weblibre/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
