name: UA Native Compile Temp

on:
  push:
    branches:
      - weblibre-ua-mainline-v3

permissions:
  contents: write

jobs:
  compile:
    if: ${{ !contains(github.event.head_commit.message, '[UA-COMPILE-AUTO]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v3
        uses: actions/checkout@v4
        with:
          ref: weblibre-ua-mainline-v3
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bootstrap workspace
        run: |
          dart pub global activate melos 7.8.1
          melos bootstrap

      - name: Compile Android Kotlin
        working-directory: apps/weblibre/android
        run: ./gradlew :app:compileStableDebugKotlin --no-daemon --stacktrace

      - name: Remove temporary compile workflow
        run: |
          git rm .github/workflows/ua-native-compile-temp.yml
          git commit -m "chore: remove temporary UA native compile runner [UA-COMPILE-AUTO]"
          git push origin HEAD:weblibre-ua-mainline-v3
