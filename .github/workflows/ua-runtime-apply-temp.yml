name: UA Runtime Apply Temp

on:
  push:
    branches:
      - weblibre-ua-mainline-v3

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[UA-AUTO]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v3
        uses: actions/checkout@v4
        with:
          ref: weblibre-ua-mainline-v3
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "brasilia736211600-netizen"
          git config user.email "brasilia736211600@gmail.com"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Patch Pigeon source contract
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('packages/flutter_mozilla_components/pigeons/gecko.dart')
          s = p.read_text()

          old = """    this.contextId,\n    required this.source,\n"""
          new = """    this.contextId,\n    this.userAgent,\n    required this.source,\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """  final String? contextId;\n  final SourceValue source;\n"""
          new = """  final String? contextId;\n  final String? userAgent;\n  final SourceValue source;\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """    required String? contextId,\n    //engineSession: EngineSession? = null,\n"""
          new = """    required String? contextId,\n    required String? userAgent,\n    //engineSession: EngineSession? = null,\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """    required String? newContextId,\n\n    /// Whether the container the duplicate is being created in is excluded from\n"""
          new = """    required String? newContextId,\n    required String? userAgent,\n\n    /// Whether the container the duplicate is being created in is excluded from\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          p.write_text(s)
          PY
          git add packages/flutter_mozilla_components/pigeons/gecko.dart
          git commit -m "feat(ua): add per-session UA Pigeon contract [UA-AUTO]"

      - name: Regenerate Pigeon outputs
        working-directory: packages/flutter_mozilla_components
        run: |
          flutter pub get
          flutter pub run pigeon --input pigeons/gecko.dart

      - name: Verify generated contract contains UA
        run: |
          grep -q "String? userAgent" packages/flutter_mozilla_components/lib/src/pigeons/gecko.g.dart
          grep -q "userAgent: String?" packages/flutter_mozilla_components/android/src/main/kotlin/eu/weblibre/flutter_mozilla_components/pigeons/Gecko.g.kt

      - name: Commit generated Pigeon outputs
        run: |
          git add packages/flutter_mozilla_components/lib/src/pigeons/gecko.g.dart packages/flutter_mozilla_components/android/src/main/kotlin/eu/weblibre/flutter_mozilla_components/pigeons/Gecko.g.kt
          git commit -m "build(pigeon): regenerate UA contract [UA-AUTO]"

      - name: Patch runtime propagation
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Dart service layer.
          p = Path('packages/flutter_mozilla_components/lib/src/domain/services/gecko_tab.dart')
          s = p.read_text()
          old = """    String? contextId,\n    Source source = Internal.newTab,\n"""
          new = """    String? contextId,\n    String? userAgent,\n    Source source = Internal.newTab,\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = """      contextId: contextId,\n      source: source.toValue(),\n"""
          new = """      contextId: contextId,\n      userAgent: userAgent,\n      source: source.toValue(),\n"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = """  Future<String> duplicateTab({\n    required String? selectTabId,\n    required String? newContextId,\n"""
          new = """  Future<String> duplicateTab({\n    required String? selectTabId,\n    required String? newContextId,\n    String? userAgent,\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = """      selectNewTab: selectNewTab,\n      newContextId: newContextId,\n      excludeFromHistory: excludeFromHistory,\n"""
          new = """      selectNewTab: selectNewTab,\n      newContextId: newContextId,\n      userAgent: userAgent,\n      excludeFromHistory: excludeFromHistory,\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)
          p.write_text(s)

          # App repository propagation.
          p = Path('apps/weblibre/lib/features/geckoview/domain/repositories/tab.dart')
          s = p.read_text()
          old = """          contextId: effectiveContextId,\n          source: source,\n"""
          new = """          contextId: effectiveContextId,\n          userAgent: assignedContainer?.metadata.userAgent,\n          source: source,\n"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = """    final createdTabIds = await db.transaction(() async {\n      final createdTabIds = await _tabsService.addMultipleTabs(\n        tabs: tabs,\n"""
          new = """    final effectiveTabs = tabs.toList(growable: true);\n    if (assignedContainer?.metadata.userAgent != null) {\n      for (final tab in effectiveTabs) {\n        tab.userAgent ??= assignedContainer!.metadata.userAgent;\n      }\n    }\n\n    final createdTabIds = await db.transaction(() async {\n      final createdTabIds = await _tabsService.addMultipleTabs(\n        tabs: effectiveTabs,\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """      newContextId: effectiveContextId,\n      selectTab: selectTab,\n"""
          new = """      newContextId: effectiveContextId,\n      userAgent: containerData?.metadata.userAgent,\n      selectTab: selectTab,\n"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Native Android integration.
          p = Path('packages/flutter_mozilla_components/android/src/main/kotlin/eu/weblibre/flutter_mozilla_components/api/GeckoTabsApiImpl.kt')
          s = p.read_text()
          old = """        flags: LoadUrlFlagsValue,\n        contextId: String?,\n        source: SourceValue,\n"""
          new = """        flags: LoadUrlFlagsValue,\n        contextId: String?,\n        userAgent: String?,\n        source: SourceValue,\n"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = """            // contextId = contextId,\n"""
          if old in s:
              raise AssertionError('unexpected commented contextId marker')

          old = """            val loadFlags = EngineSession.LoadUrlFlags.select(flags.value.toInt())\n\n            // Inlined from TabsUseCases.AddNewTabUseCase"""
          new = """            val loadFlags = EngineSession.LoadUrlFlags.select(flags.value.toInt())\n            val engineSession = components.core.engine.createSession(\n                private = private,\n                contextId = contextId,\n            ).also { session ->\n                session.settings.userAgentString = userAgent\n            }\n\n            // Inlined from TabsUseCases.AddNewTabUseCase"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """                contextId = contextId,\n                parent = parentId?.let { components.core.store.state.findTab(it) },\n"""
          new = """                contextId = contextId,\n                engineSession = engineSession,\n                parent = parentId?.let { components.core.store.state.findTab(it) },\n"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = """        selectNewTab: Boolean,\n        newContextId: String?,\n        excludeFromHistory: Boolean\n"""
          new = """        selectNewTab: Boolean,\n        newContextId: String?,\n        userAgent: String?,\n        excludeFromHistory: Boolean\n"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = """            val tabState = selectTabId?.let { components.core.store.state.findTab(it) }\n                ?: throw IllegalArgumentException(\"Tab not found\")\n\n            val duplicate = createTab(\n"""
          new = """            val tabState = selectTabId?.let { components.core.store.state.findTab(it) }\n                ?: throw IllegalArgumentException(\"Tab not found\")\n            val engineSession = components.core.engine.createSession(\n                private = tabState.content.private,\n                contextId = newContextId,\n            ).also { session ->\n                session.settings.userAgentString = userAgent\n            }\n\n            val duplicate = createTab(\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """                private = tabState.content.private,\n                contextId = newContextId,\n                parent = tabState,\n"""
          new = """                private = tabState.content.private,\n                contextId = newContextId,\n                engineSession = engineSession,\n                parent = tabState,\n"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = """    override fun addMultipleTabs(\n        tabs: List<AddTabParams>,\n        selectTabId: String?,\n        excludeFromHistory: Boolean\n"""
          assert s.count(old) == 1
          # No signature change needed: UA is carried by AddTabParams.

          old = """                    contextId = params.contextId,\n                    //ParentId currently not supported for multiple tabs\n"""
          new = """                    contextId = params.contextId,\n                    engineSession = components.core.engine.createSession(\n                        private = params.private,\n                        contextId = params.contextId,\n                    ).also { session ->\n                        session.settings.userAgentString = params.userAgent\n                    },\n                    //ParentId currently not supported for multiple tabs\n"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git add packages/flutter_mozilla_components/lib/src/domain/services/gecko_tab.dart \
            apps/weblibre/lib/features/geckoview/domain/repositories/tab.dart \
            packages/flutter_mozilla_components/android/src/main/kotlin/eu/weblibre/flutter_mozilla_components/api/GeckoTabsApiImpl.kt
          git commit -m "feat(ua): apply container UA before first navigation [UA-AUTO]"

      - name: Targeted Dart and native contract checks
        run: |
          flutter analyze packages/flutter_mozilla_components/lib/src/domain/services/gecko_tab.dart apps/weblibre/lib/features/geckoview/domain/repositories/tab.dart
          cd packages/flutter_mozilla_components
          flutter test

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/ua-runtime-apply-temp.yml
          git commit -m "chore: remove temporary UA patch runner [UA-AUTO]"

      - name: Push atomic UA commits
        run: git push origin HEAD:weblibre-ua-mainline-v3
