name: WebLibre Android APK

on:
  push:
    branches:
      - custom-browser-development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weblibre-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WebLibre Android APK
    runs-on: ubuntu-latest

    env:
      SING_BOX_TAG: v1.13.12
      SING_BOX_COMMIT: 1086ab2563320e0da0c23b3a491d8dfa0939dff4
      IPTPROXY_TAG: 5.4.2
      IPTPROXY_COMMIT: 3b99b6b1f4d5b51aea97d7213bc36e74ec77c84d
      DNSTT_COMMIT: f1b9b97a269f83bad41d2ceef291b4d2c161cd11
      ANDROID_NDK_VERSION: 29.0.14206865
      GOMOBILE_VERSION: v0.1.12
      FLUTTER_VERSION: 3.47.0

    steps:
      - name: Checkout WebLibre
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go 1.25.0
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/flutter_mozilla_components/javascript/container_proxy/package-lock.json
            packages/flutter_mozilla_components/javascript/readability/package-lock.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build requirements
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          go version
          flutter --version
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          test -f "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/source.properties"

      - name: Checkout pinned sing-box
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --depth 1 \
            --branch "${SING_BOX_TAG}" \
            "https://github.com/SagerNet/sing-box.git" \
            "${GITHUB_WORKSPACE}/../sing-box"

          git -C "${GITHUB_WORKSPACE}/../sing-box" fetch --tags --depth 1 origin "${SING_BOX_TAG}"
          test "$(git -C "${GITHUB_WORKSPACE}/../sing-box" rev-parse HEAD)" = "${SING_BOX_COMMIT}"

      - name: Checkout pinned IPtProxy
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --depth 1 \
            --branch "${IPTPROXY_TAG}" \
            "https://github.com/tladesignz/IPtProxy.git" \
            "${GITHUB_WORKSPACE}/../IPtProxy"

          git -C "${GITHUB_WORKSPACE}/../IPtProxy" fetch --tags --depth 1 origin "${IPTPROXY_TAG}"
          test "$(git -C "${GITHUB_WORKSPACE}/../IPtProxy" rev-parse HEAD)" = "${IPTPROXY_COMMIT}"

          git -C "${GITHUB_WORKSPACE}/../IPtProxy" submodule sync --recursive
          git -C "${GITHUB_WORKSPACE}/../IPtProxy" submodule update --init --recursive

          test -d "${GITHUB_WORKSPACE}/../IPtProxy/dnstt"
          test "$(git -C "${GITHUB_WORKSPACE}/../IPtProxy/dnstt" rev-parse HEAD)" = "${DNSTT_COMMIT}"

      - name: Build combined Go mobile runtime
        shell: bash
        run: |
          set -euo pipefail
          chmod +x native/go_mobile_runtime/scripts/build-android.sh

          export ANDROID_HOME="${ANDROID_HOME}"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          export NDK_HOME="${ANDROID_NDK_HOME}"
          export JAVA_HOME="${JAVA_HOME}"

          ./native/go_mobile_runtime/scripts/build-android.sh

      - name: Verify native AAR
        shell: bash
        run: |
          set -euo pipefail
          AAR="native/go_mobile_runtime/build/weblibre-go.aar"

          if [ ! -f "$AAR" ]; then
            echo "ERROR: Required native AAR was not produced: $AAR"
            exit 1
          fi

          ls -lh "$AAR"

      - name: Prepare WebLibre assets and components
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/update-assets.sh

          sh scripts/build-container-proxy.sh
          sh scripts/build-readability.sh
          python3 scripts/build_quotes_db.py
          python3 scripts/build_sites_db.py

      - name: Verify generated assets
        shell: bash
        run: |
          set -euo pipefail

          test -f packages/flutter_mozilla_components/android/src/main/assets/extensions/browser_extension/readability.min.js
          test -f apps/weblibre/assets/quotes/quotes.db
          test -f apps/weblibre/assets/sites/sites.db
          test -f apps/weblibre/assets/ublock/assets.json

      - name: Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Build stable APKs
        shell: bash
        working-directory: apps/weblibre
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --flavor stable \
            --target-platform android-arm,android-arm64 \
            --split-per-abi \
            --no-tree-shake-icons

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKs=(apps/weblibre/build/app/outputs/flutter-apk/*.apk)

          if [ "${#APKs[@]}" -eq 0 ]; then
            echo "ERROR: No APK files were produced."
            exit 1
          fi

          printf '%s\n' "${APKs[@]}"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weblibre-stable-apks
          path: apps/weblibre/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
