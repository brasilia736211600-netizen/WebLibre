name: WebLibre Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/weblibre/**'
      - 'packages/flutter_mozilla_components/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'melos.yaml'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Bootstrap workspace
        run: |
          dart pub global activate melos 7.8.1
          melos bootstrap
      - name: Run targeted container tests
        working-directory: apps/weblibre
        run: flutter test test/features/geckoview/features/tabs/data/models/container_data_test.dart
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.4.1
      - name: Run targeted native container tests
        working-directory: packages/flutter_mozilla_components/android
        run: gradle --no-daemon --stacktrace testDebugUnitTest --tests 'eu.weblibre.flutter_mozilla_components.feature.ContainerUserAgentStoreTest' --tests 'eu.weblibre.flutter_mozilla_components.feature.ContainerProxyFeatureTest'
      - name: Collect native test diagnostics
        if: failure()
        working-directory: packages/flutter_mozilla_components/android
        run: |
          set +e
          mkdir -p ci-diagnostics
          find build/test-results -type f -maxdepth 6 -print -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \; > ci-diagnostics/test-results.txt 2>&1
          find build/reports/tests -type f -maxdepth 6 -print -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \; > ci-diagnostics/test-reports.txt 2>&1
      - name: Upload native test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-diagnostics
          path: packages/flutter_mozilla_components/android/ci-diagnostics
          if-no-files-found: warn
