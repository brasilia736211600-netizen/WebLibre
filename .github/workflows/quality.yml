name: WebLibre Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/weblibre/**'
      - 'packages/flutter_mozilla_components/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'melos.yaml'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Bootstrap workspace
        run: |
          dart pub global activate melos 7.8.1
          melos bootstrap
      - name: Run targeted container tests
        working-directory: apps/weblibre
        run: flutter test test/features/geckoview/features/tabs/data/models/container_data_test.dart
      - name: Run native plugin unit tests
        working-directory: packages/flutter_mozilla_components/android
        run: gradle test
