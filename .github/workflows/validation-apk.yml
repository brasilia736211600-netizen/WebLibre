name: WebLibre Validation APK

on:
  push:
    branches:
      - weblibre-ua-mainline-v3
  workflow_dispatch:

concurrency:
  group: validation-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEY_JKS: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_PATH: ${{ github.workspace }}/apps/weblibre/key.jks
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          swap-storage: false

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install Android NDK
        run: |
          set -euo pipefail
          ANDROID_NDK_VERSION="$(sed -n 's/^weblibre\.ndkVersion[[:space:]]*=[[:space:]]*//p' apps/weblibre/android/gradle.properties)"
          test -n "$ANDROID_NDK_VERSION"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          set -o pipefail
          test -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache Go build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/go/bin/gomobile
            ~/go/bin/gobind
          key: ${{ runner.os }}-go-runtime-${{ hashFiles('native/go_mobile_runtime/pins.env') }}
          restore-keys: |
            ${{ runner.os }}-go-runtime-

      - name: Create key file
        working-directory: apps/weblibre
        run: |
          set -euo pipefail
          test -n "$KEY_JKS"
          echo "$KEY_JKS" | base64 -di > key.jks
          chmod 600 key.jks

      - name: Bootstrap Flutter workspace
        run: |
          dart pub global activate melos 7.8.1
          melos bootstrap

      - name: Update external assets
        run: melos run update-assets --no-select

      - name: Build components
        run: melos run build-components --no-select

      - name: Checkout native runtime sources
        run: |
          set -euo pipefail
          source native/go_mobile_runtime/pins.env
          git clone https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"
          git -C "$RUNNER_TEMP/sing-box" checkout "$SING_BOX_TAG"
          test "$(git -C "$RUNNER_TEMP/sing-box" rev-parse HEAD)" = "$SING_BOX_COMMIT"
          git clone https://github.com/tladesignz/IPtProxy.git "$RUNNER_TEMP/IPtProxy"
          git -C "$RUNNER_TEMP/IPtProxy" checkout "$IPTPROXY_TAG"
          test "$(git -C "$RUNNER_TEMP/IPtProxy" rev-parse HEAD)" = "$IPTPROXY_COMMIT"
          git -C "$RUNNER_TEMP/IPtProxy" submodule update --init dnstt

      - name: Build native gomobile runtime
        env:
          SING_BOX_SOURCE: ${{ runner.temp }}/sing-box
          IPTPROXY_SOURCE: ${{ runner.temp }}/IPtProxy
        run: melos run build-go-runtime --no-select

      - name: Build stable split APKs
        run: melos run build-browser --no-select

      - name: Build stable emulator smoke APK
        working-directory: apps/weblibre
        run: flutter build apk --flavor stable --debug --no-tree-shake-icons

      - name: Verify APK outputs
        run: |
          set -euo pipefail
          ls -lh apps/weblibre/build/app/outputs/apk/stable/release/
          test -n "$(find apps/weblibre/build/app/outputs/apk/stable/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -f apps/weblibre/build/app/outputs/flutter-apk/app-stable-debug.apk

      - name: Upload validation APKs
        uses: actions/upload-artifact@v4
        with:
          name: weblibre-stable-apk-${{ github.sha }}
          path: |
            apps/weblibre/build/app/outputs/apk/stable/release/*.apk
            apps/weblibre/build/app/outputs/flutter-apk/app-stable-debug.apk
          if-no-files-found: error

      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            adb install -r apps/weblibre/build/app/outputs/flutter-apk/app-stable-debug.apk
            adb shell am force-stop eu.weblibre.gecko
            adb shell monkey -p eu.weblibre.gecko 1
            sleep 12
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|eu.weblibre.gecko' || true
            if adb logcat -d -b crash | grep -E 'FATAL EXCEPTION|Process: eu\.weblibre\.gecko' ; then
              echo 'Application crash detected during emulator smoke test.' >&2
              exit 1
            fi
            adb shell am force-stop eu.weblibre.gecko
            adb shell monkey -p eu.weblibre.gecko 1
            sleep 8
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|eu\.weblibre\.gecko' || true
            adb logcat -d > "$RUNNER_TEMP/weblibre-emulator-logcat.txt"

      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weblibre-emulator-logcat-${{ github.sha }}
          path: ${{ runner.temp }}/weblibre-emulator-logcat.txt
          if-no-files-found: warn

      - name: Cleanup signing key
        if: always()
        working-directory: apps/weblibre
        run: rm -f key.jks
