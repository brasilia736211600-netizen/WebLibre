plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose" version "2.4.0"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"
def weblibreGoMobileAar = file("../../../../native/go_mobile_runtime/build/weblibre-go.aar")

android {
    namespace = "eu.weblibre.gecko"
    compileSdk = 37
    ndkVersion = rootProject.ext.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "eu.weblibre.gecko"
        minSdkVersion = 26
        targetSdk = 37
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        manifestPlaceholders = [enableImpeller: "true"]
    }

    flavorDimensions "track"
    productFlavors {
        stable {
            dimension "track"
            manifestPlaceholders = [appName: "WebLibre"]
        }
        alpha {
            dimension "track"
            applicationIdSuffix ".alpha"
            versionNameSuffix "-alpha"
            manifestPlaceholders = [appName: "WebLibre Alpha", enableImpeller: "true"]
        }
        alphaLegacy {
            dimension "track"
            applicationIdSuffix ".alpha"
            versionNameSuffix "-alpha"
            manifestPlaceholders = [appName: "WebLibre Alpha (Legacy)", enableImpeller: "false"]
        }
    }

    sourceSets {
        alphaLegacy { res.srcDirs += 'src/alpha/res' }
    }

    dependencies {
        if (!weblibreGoMobileAar.exists()) {
            throw new GradleException(
                "Missing combined gomobile runtime AAR: ${weblibreGoMobileAar}. " +
                    "Run native/go_mobile_runtime/scripts/build-android.sh from the repository root."
            )
        }
        implementation files(weblibreGoMobileAar)
        implementation('androidx.glance:glance-appwidget') {
            version { strictly '1.1.1' }
            because 'home_widget uses 1.+ and newer alpha releases require AGP 9.1 and compileSdk 37'
        }
        implementation 'com.google.android.material:material:1.14.0'
    }

    buildFeatures { compose true }

    signingConfigs {
        release {
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
            storeFile System.getenv("KEY_PATH") ? file(System.getenv("KEY_PATH")) : null
            storePassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            shrinkResources = !project.hasProperty("disableOptimization")
            minifyEnabled = !project.hasProperty("disableOptimization")
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release']
        }
    }

    bundle {
        packagingOptions { jniLibs { it.useLegacyPackaging = true } }
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 }
}

flutter { source = "../.." }

// AGP 9 removed the legacy applicationVariants/OutputFile API. Keep ABI-specific
// version codes only for release variants using the modern Variant API.
ext.abiCodes = ["x86_64": 1, "armeabi-v7a": 2, "arm64-v8a": 3]
androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType.name() == "ABI" }?.identifier
            def abiVersionCode = project.ext.abiCodes.get(abi)
            if (abiVersionCode != null) {
                output.versionCode.set(variant.versionCode.get() * 10 + abiVersionCode)
            }
        }
    }
}
